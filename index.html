}

function blip(freq=440,dur=.12,type='sine',gain=.07,delay=0,endFreq=null){
 if(!soundOn)return; const A=audioCtx(); if(!A)return;
 const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);

}

 let d=Math.hypot(B.x-T.x,B.y-T.y),q=d/targetR;
 celebrate(q<.28?'PERFECT':q<.62?'GREAT':'GOOD');
 score++;if(score%5===4){toastMsg('✨ QUASI AL PROSSIMO MONDO…',P()[3]);tone('great')}if(score>best){best=score;localStorage.dlgBest3=best}
 // rewards: every 5 points restore a life, every 10 add a rescue
 if(score%5===0&&lives<5){lives++;show('BONUS ♥','VITA RECUPERATA',P()[3]);burst(W/2,H*.42,'#ff6ca8',35,180)}
 if(score%10===0&&shield<3){shield++;floaters.push({txt:'🛡 SALVATAGGIO +1',life:1.4})}if(score%5===0)levelUp();
 C={...T};targetR=Math.max(42,62-score*.45);shapeMode=shapeForWorld(Math.floor(score/5)%8);
 const side=score%2===0?.34:.66,vert=C.y<H*.46?.69:.31;
 T={x:W*side+(Math.random()-.5)*W*.055,y:H*vert+(Math.random()-.5)*24};
 dir*=-1;omega=Math.min(3.25,1.25+score*.042);ang=Math.atan2(B.y-C.y,B.x-C.x);V={x:0,y:0};state='orbit';sync()
}
function miss(){
 combo=0;burst(B.x,B.y,'#ff4f87',32,190);shake=7;
 if(shield>0){shield--;show('SAVED! 🛡','STESSO CERCHIO • RIPROVA','#75e9ff');toastMsg('ANCORA TU 🎯','#75e9ff');tone('save');buzz([25,25,20]);recover()}
 else {lives--;sync();buzz([30,35,30]);if(lives>0){show('QUASI!','HAI ANCORA '+lives+' VITE','#ff78aa');toastMsg('STESSO BERSAGLIO','#ff9dc1');tone('fail');recover()}else{tone('fail');state='dead';summary.textContent='SCORE '+score+'  •  BEST '+best;dead.style.display='flex'}}
}
function recover(){
 const keepC={...C},keepT={...T},keepDir=dir,keepOmega=omega,keepTargetR=targetR;
 state='recover';
 setTimeout(()=>{
   C=keepC;T=keepT;dir=keepDir;omega=Math.max(1.05,keepOmega*.90);targetR=keepTargetR;
   // restart on the SAME circle and SAME target; choose a calm starting point
   const toTarget=Math.atan2(T.y-C.y,T.x-C.x);
   ang=toTarget-dir*Math.PI/2;
   B={x:C.x+Math.cos(ang)*orbitR,y:C.y+Math.sin(ang)*orbitR};V={x:0,y:0};
   state='orbit';hint.style.display='block';idealHint=1.5;sync()
 },560)
}
function update(dt){
 if(state==='orbit'){ang+=omega*dir*dt;B.x=C.x+Math.cos(ang)*orbitR;B.y=C.y+Math.sin(ang)*orbitR}
 else if(state==='fly'){trail.push({x:B.x,y:B.y,life:.38});B.x+=V.x*dt;B.y+=V.y*dt;if(Math.hypot(B.x-T.x,B.y-T.y)<=targetR+ballR)land();else if(B.x<-55||B.x>W+55||B.y<-75||B.y>H+75)miss()}
 particles.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.982;o.vy*=.982;o.life-=dt});particles=particles.filter(o=>o.life>0);
 rings.forEach(o=>{o.r+=230*dt;o.a-=1.45*dt});rings=rings.filter(o=>o.a>0);
 trail.forEach(o=>o.life-=dt);trail=trail.filter(o=>o.life>0);
 stars.forEach(s=>{s.y+=s.s*7*dt;if(s.y>H)s.y=0});
 floaters.forEach(f=>f.life-=dt);floaters=floaters.filter(f=>f.life>0);confetti.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=190*dt;q.vx*=.992;q.life-=dt;q.rot+=4*dt});confetti=confetti.filter(q=>q.life>0);
 mystery=Math.max(0,mystery-dt);
 surpriseTime=Math.max(0,surpriseTime-dt);
 if(surpriseTime>0&&surpriseTime<.55){surpriseCard.style.opacity=Math.max(0,surpriseTime/.55);surpriseCard.style.transform='scale(.92) rotate(2deg)'}
 musicClock+=dt;let beat=Math.max(.32,.58-score*.006);if(musicClock>beat){musicClock=0;ambientTick()}
 flash=Math.max(0,flash-dt);shake=Math.max(0,shake-25*dt);successPulse=Math.max(0,successPulse-dt);idealHint=Math.max(0,idealHint-dt);auroraT+=dt;
 if(ratingTime>0){ratingTime-=dt;if(ratingTime<.35){ratingEl.style.opacity=Math.max(0,ratingTime/.35);ratingEl.style.transform='scale(1)'}}
 if(levelTime>0){levelTime-=dt;if(levelTime<.65){levelBanner.style.opacity=Math.max(0,levelTime/.65);levelBanner.style.transform='scale(.88) rotate(2deg)'}}if(toastTime>0){toastTime-=dt;if(toastTime<.35){toast.style.opacity=Math.max(0,toastTime/.35);toast.style.transform='translateY(-22px) scale(.96)'}}
}
function draw(){
 const p=P(),g=ctx.createRadialGradient(W*.5,H*.42,20,W*.5,H*.45,H*.8);g.addColorStop(0,p[1]);g.addColorStop(.55,p[0]);g.addColorStop(1,'#030712');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 // world-specific animated spectacle
 let wi=Math.floor(score/5)%8;
 ctx.save();ctx.globalCompositeOperation='screen';
 if(wi===0){ // garden: petals/fireflies
   for(let i=0;i<24;i++){let px=(i*71+auroraT*(8+i%3))%W,py=(i*137+Math.sin(auroraT+i)*35)%H;ctx.globalAlpha=.18+.35*(.5+.5*Math.sin(auroraT*2+i));ctx.fillStyle=i%2?p[2]:p[3];ctx.beginPath();ctx.ellipse(px,py,2.5,6,auroraT+i,0,Math.PI*2);ctx.fill()}
 } else if(wi===1){ // cosmic: comets
   for(let i=0;i<12;i++){let px=(W+120-((auroraT*75+i*93)%(W+240))),py=(i*73)%H;ctx.globalAlpha=.35;ctx.strokeStyle=i%2?p[3]:p[2];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+38,py-18);ctx.stroke()}
 } else if(wi===2){ // candy: bubbles
   for(let i=0;i<20;i++){let r=4+(i%5)*3,px=(i*97)%W,py=H-((auroraT*(18+i%4)+i*61)%(H+80));ctx.globalAlpha=.17;ctx.fillStyle=[p[2],p[3],p[4]][i%3];ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill()}
 } else if(wi===3){ // deep blue: sonar rings
   for(let i=0;i<4;i++){let rr=((auroraT*70+i*90)%(Math.max(W,H)*.75));ctx.globalAlpha=.13;ctx.strokeStyle=p[3];ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H*.5,rr,0,Math.PI*2);ctx.stroke()}
 } else if(wi===4){ // fireworks sparks
   for(let i=0;i<30;i++){let a=i*.78+auroraT*.25,rr=28+((i*19+auroraT*45)%150);ctx.globalAlpha=.15+.25*(i%3===0);ctx.fillStyle=i%2?p[3]:p[2];ctx.beginPath();ctx.arc(W*.5+Math.cos(a)*rr,H*.43+Math.sin(a)*rr,1.5+(i%4===0)*2,0,Math.PI*2);ctx.fill()}
 } else if(wi===5){ // aurora ribbons extra
   for(let i=0;i<5;i++){let y=H*(.2+i*.13)+Math.sin(auroraT*.8+i)*25;ctx.globalAlpha=.12;ctx.strokeStyle=[p[2],p[3],p[4]][i%3];ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(-20,y);for(let x0=0;x0<W+40;x0+=35)ctx.lineTo(x0,y+Math.sin(x0/55+auroraT+i)*16);ctx.stroke()}
 } else if(wi===6){ // cyber rain
   ctx.font='12px monospace';for(let i=0;i<26;i++){let px=(i*43)%W,py=(auroraT*(25+i%5)+i*79)%(H+80)-40;ctx.globalAlpha=.12;ctx.fillStyle=i%2?p[2]:p[3];ctx.fillText(i%3===0?'01':'•',px,py)}
 } else { // gold rush: diamonds
   for(let i=0;i<22;i++){let px=(i*89+Math.sin(auroraT+i)*28)%W,py=(i*113+auroraT*(10+i%4))%H;ctx.globalAlpha=.16+.22*(.5+.5*Math.sin(auroraT*2+i));ctx.fillStyle=i%2?p[3]:p[2];ctx.save();ctx.translate(px,py);ctx.rotate(Math.PI/4+auroraT*.2);ctx.fillRect(-3,-3,6,6);ctx.restore()}
 }
 ctx.restore();ctx.globalAlpha=1;
 // unlocked companion glimp
 if(unlocked.length){
   let gi=unlocked[unlocked.length-1]%glimps.length,g=glimps[gi],gx=W*.14,gy=H*.73+Math.sin(auroraT*2)*8;
   ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.65;ctx.shadowBlur=18;ctx.shadowColor=p[3];ctx.fillStyle=p[3];
   if(g.kind==='blob'){ctx.beginPath();ctx.ellipse(gx,gy,18,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx+6,gy-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=p[0];ctx.beginPath();ctx.arc(gx+7,gy-3,2,0,Math.PI*2);ctx.fill()}
   else if(g.kind==='spark'){ctx.font='34px system-ui';ctx.fillText('⚡',gx-15,gy+10)}
   else if(g.kind==='moon'){ctx.font='34px system-ui';ctx.fillText('◐',gx-16,gy+10)}
   else if(g.kind==='eye'){ctx.font='34px system-ui';ctx.fillText('◉',gx-16,gy+10)}
   else if(g.kind==='flower'){ctx.font='34px system-ui';ctx.fillText('✿',gx-16,gy+10)}
   else if(g.kind==='ufo'){ctx.font='34px system-ui';ctx.fillText('⌁',gx-16,gy+10)}
   else if(g.kind==='star'){ctx.font='34px system-ui';ctx.fillText('★',gx-16,gy+10)}
   else if(g.kind==='jelly'){ctx.font='34px system-ui';ctx.fillText('◌',gx-16,gy+10)}
   else if(g.kind==='crown'){ctx.font='34px system-ui';ctx.fillText('♛',gx-16,gy+10)}
   else if(g.kind==='cosmo'){ctx.font='34px system-ui';ctx.fillText('◎',gx-16,gy+10)}
   else if(g.kind==='gem'){ctx.font='34px system-ui';ctx.fillText('◆',gx-16,gy+10)}
   else {ctx.font='34px system-ui';ctx.fillText('✹',gx-16,gy+10)}
   ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;
 }
 // active surprise effect for the current level
 ctx.save();ctx.globalCompositeOperation='screen';
 let sm=surpriseMode;
 if(sm===0){ // rainbow comet
   for(let i=0;i<14;i++){let xx=(W+120-((auroraT*(95+i*2)+i*71)%(W+180))),yy=(i*59)%H;ctx.globalAlpha=.28;ctx.strokeStyle=[p[2],p[3],p[4],'#fff'][i%4];ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+55,yy-22);ctx.stroke()}
 } else if(sm===1){ // star storm
   for(let i=0;i<38;i++){let xx=(i*83+Math.sin(auroraT+i)*18)%W,yy=(auroraT*(28+i%6)+i*61)%(H+50)-25;ctx.globalAlpha=.18+.22*(i%4===0);ctx.fillStyle=i%3?p[3]:'#fff';ctx.beginPath();ctx.arc(xx,yy,1+(i%5===0)*2.2,0,Math.PI*2);ctx.fill()}
 } else if(sm===2){ // gold fever
   for(let i=0;i<26;i++){let xx=(i*97)%W,yy=H-((auroraT*(20+i%4)+i*53)%(H+80));ctx.globalAlpha=.22;ctx.fillStyle=i%2?'#ffe47a':'#fff1b5';ctx.save();ctx.translate(xx,yy);ctx.rotate(Math.PI/4+auroraT);ctx.fillRect(-3,-3,6,6);ctx.restore()}
 } else if(sm===3){ // portal chaos
   for(let i=0;i<5;i++){let rr=35+i*30+8*Math.sin(auroraT*2+i);ctx.globalAlpha=.10+i*.02;ctx.strokeStyle=i%2?p[2]:p[3];ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H*.5,rr,auroraT+i,auroraT+i+Math.PI*1.35);ctx.stroke()}
 } else if(sm===4){ // bloom
   for(let i=0;i<18;i++){let a=i*Math.PI/9+auroraT*.15,rr=80+(i%4)*35;ctx.globalAlpha=.13;ctx.fillStyle=i%2?p[2]:p[3];ctx.beginPath();ctx.ellipse(W/2+Math.cos(a)*rr,H*.48+Math.sin(a)*rr,4,13,a,0,Math.PI*2);ctx.fill()}
 } else if(sm===5){ // laser rain
   for(let i=0;i<24;i++){let xx=(i*47)%W,yy=(auroraT*(70+i%3)+i*83)%(H+120)-60;ctx.globalAlpha=.14;ctx.strokeStyle=i%2?p[2]:p[3];ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-12,yy+60);ctx.stroke()}
 } else if(sm===6){ // cosmic spiral
   for(let i=0;i<55;i++){let a=i*.42+auroraT*.35,rr=10+i*3.1;ctx.globalAlpha=.08+.16*(i%6===0);ctx.fillStyle=i%2?p[3]:'#fff';ctx.beginPath();ctx.arc(W/2+Math.cos(a)*rr,H*.5+Math.sin(a)*rr*.65,1.4+(i%7===0),0,Math.PI*2);ctx.fill()}
 } else { // fireworks jackpot
   for(let k=0;k<3;k++){let cx=W*(.25+k*.25),cy=H*(.28+(k%2)*.18);for(let i=0;i<14;i++){let a=i*Math.PI/7+auroraT*.2,rr=18+((auroraT*38+k*23)%70);ctx.globalAlpha=.17;ctx.fillStyle=[p[2],p[3],'#fff'][i%3];ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,1.6,0,Math.PI*2);ctx.fill()}}
 }
 ctx.restore();ctx.globalAlpha=1;
 // moving aurora ribbons
 ctx.save();
 ctx.globalCompositeOperation='screen';
 for(let k=0;k<3;k++){
   const yy=H*(.24+k*.22)+Math.sin(auroraT*(.55+k*.13)+k)*28;
   const grad=ctx.createLinearGradient(0,yy,W,yy);
   grad.addColorStop(0,'rgba(255,255,255,0)');
   grad.addColorStop(.35,k===0?p[2]+'38':p[4]+'30');
   grad.addColorStop(.65,k===1?p[3]+'35':p[2]+'25');
   grad.addColorStop(1,'rgba(255,255,255,0)');
   ctx.strokeStyle=grad;ctx.lineWidth=20+8*k;ctx.beginPath();
   ctx.moveTo(-30,yy);
   for(let xx=0;xx<=W+40;xx+=40)ctx.lineTo(xx,yy+Math.sin(xx/70+auroraT*(.7+k*.17)+k)*18);
   ctx.stroke();
 }
 ctx.restore();
 // animated stars / sparkles
 for(let i=0;i<stars.length;i++){let s=stars[i],tw=.2+.65*(.5+.5*Math.sin(performance.now()/300+i));ctx.globalAlpha=tw;ctx.fillStyle=i%4===0?p[3]:'#fff';ctx.shadowBlur=i%4===0?8:0;ctx.shadowColor=p[3];ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 // orbit path with moving dots
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(C.x,C.y,orbitR,0,Math.PI*2);ctx.stroke();
 // gentle launch-assist arc after a miss / at start
 if(idealHint>0){
   const targetAngle=Math.atan2(T.y-C.y,T.x-C.x)-dir*Math.PI/2;
   ctx.globalAlpha=Math.min(.75,idealHint);ctx.strokeStyle=p[3];ctx.lineWidth=8;ctx.lineCap='round';
   ctx.shadowBlur=18;ctx.shadowColor=p[3];ctx.beginPath();ctx.arc(C.x,C.y,orbitR,targetAngle-.18,targetAngle+.18);ctx.stroke();
   ctx.shadowBlur=0;ctx.globalAlpha=1;
 }
 for(let i=0;i<3;i++){let a=ang-dir*(.35+i*.28);ctx.fillStyle=p[2];ctx.globalAlpha=.18-i*.04;ctx.beginPath();ctx.arc(C.x+Math.cos(a)*orbitR,C.y+Math.sin(a)*orbitR,4-i,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // target multi-glow
 let pulse=1+.055*Math.sin(performance.now()/180);
 ctx.shadowBlur=40;ctx.shadowColor=p[2];ctx.fillStyle=p[2]+'25';pathShape(T.x,T.y,targetR*pulse,shapeMode,auroraT*.35);ctx.fill();
 ctx.lineWidth=6;ctx.strokeStyle=p[2];pathShape(T.x,T.y,targetR*pulse,shapeMode,auroraT*.35);ctx.stroke();
 ctx.lineWidth=2;ctx.strokeStyle=p[3];ctx.globalAlpha=.48;pathShape(T.x,T.y,targetR*.58,shapeMode,-auroraT*.25);ctx.stroke();
 ctx.globalAlpha=.28;ctx.fillStyle='#fff';pathShape(T.x,T.y,targetR*.28,shapeMode,auroraT*.45);ctx.fill();ctx.globalAlpha=1;
 for(let j=0;j<10;j++){
   let a=auroraT*(1.2+j*.06)+j*Math.PI/5, rr=targetR+14+6*Math.sin(auroraT*2+j);
   ctx.fillStyle=j%2?p[3]:'#fff';ctx.shadowBlur=10;ctx.shadowColor=p[3];ctx.beginPath();ctx.arc(T.x+Math.cos(a)*rr,T.y+Math.sin(a)*rr,1.8+(j%2),0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;
 // trail
 trail.forEach(t=>{let a=t.life/.38;ctx.globalAlpha=a*.6;ctx.fillStyle=p[3];ctx.shadowBlur=14;ctx.shadowColor=p[3];ctx.beginPath();ctx.arc(t.x,t.y,ballR*a,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=0;
 // ball
 ctx.shadowBlur=32;ctx.shadowColor=p[3];let bg=ctx.createRadialGradient(B.x-3,B.y-3,1,B.x,B.y,ballR*1.6);bg.addColorStop(0,'#fff');bg.addColorStop(.45,p[3]);bg.addColorStop(1,p[2]);ctx.fillStyle=bg;ctx.beginPath();ctx.arc(B.x,B.y,ballR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 // celebration
 particles.forEach(o=>{ctx.globalAlpha=Math.min(1,o.life/.35);ctx.fillStyle=o.col;ctx.shadowBlur=8;ctx.shadowColor=o.col;if(o.star){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.life*5);ctx.fillRect(-o.r*.5,-o.r*2,o.r,o.r*4);ctx.fillRect(-o.r*2,-o.r*.5,o.r*4,o.r);ctx.restore()}else{ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}});
 rings.forEach(r=>{ctx.globalAlpha=r.a;ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()});confetti.forEach(q=>{ctx.save();ctx.globalAlpha=Math.min(1,q.life);ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillStyle=q.col;ctx.shadowBlur=8;ctx.shadowColor=q.col;ctx.fillRect(-q.r,-q.r*.45,q.r*2,q.r*.9);ctx.restore()});
 ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
 if(successPulse){
   ctx.globalAlpha=successPulse*.55;ctx.strokeStyle=P()[3];ctx.lineWidth=10;ctx.beginPath();ctx.arc(W/2,H/2,Math.max(W,H)*(1-successPulse*.5),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1
 }
 if(flash){ctx.fillStyle=`rgba(255,255,255,${flash*.85})`;ctx.fillRect(0,0,W,H)}
}
function loop(n){let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();requestAnimationFrame(loop)}
collectionBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();renderCollection();collectionPanel.style.display='flex'},{passive:false});
collectionPanel.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();collectionPanel.style.display='none'},{passive:false});
soundBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';if(soundOn){audioCtx();fanfare()}},{passive:false});
addEventListener('pointerdown',e=>{e.preventDefault();if(e.target===soundBtn||collectionPanel.style.display==='flex')return;if(state==='dead')reset();else release()},{passive:false});
renderCollection();addEventListener('resize',resize);resize();requestAnimationFrame(loop)
})();
</script></body></html>
